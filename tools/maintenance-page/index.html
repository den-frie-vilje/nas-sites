<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Lukket for vedligeholdelse</title>
<style>
  :root { color-scheme: light dark; --bg: #f7f5f2; --fg: #1e1e1c; --muted: #6b6965; --rule: #d9d6d1; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #ecebe8; --muted: #a3a09b; --rule: #33322f; } }
  html { background: var(--bg); color: var(--fg); font: 18px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; }
  main { max-width: 36rem; }
  h1 { font-size: 1.75rem; line-height: 1.25; margin: 0 0 1rem; font-weight: 600; letter-spacing: -0.01em; }
  p { margin: 0 0 1rem; }
  .site { font-weight: 600; }
  footer { margin-top: 2.5rem; padding-top: 1rem; border-top: 1px solid var(--rule); color: var(--muted); font-size: 0.9rem; }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Lukket for vedligeholdelse</h1>
  <p><span class="site"><!--# echo var="host" default="Siden" --></span> er midlertidigt lukket, mens en sikkerhedsopdatering til den software, siden kører på, bliver installeret og afprøvet.</p>
  <p>Alt indhold er bevaret. Siden åbner igen, så snart opdateringen er på plads.</p>
  <p>Spørgsmål kan sendes til <a href="mailto:ole@denfrievilje.dk">ole@denfrievilje.dk</a>.</p>
  <footer>Driftes af Den Frie Vilje</footer>
</main>
</body>
</html>
