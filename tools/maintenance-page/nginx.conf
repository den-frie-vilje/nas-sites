# Language from the browser, Danish when it asks for Danish first, English
# otherwise; ?lang=da or ?lang=en overrides.
map $http_accept_language $lang_auto { default en; ~*^da da; }
map $arg_lang $lang { default $lang_auto; da da; en en; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /ping { return 200 "ok\n"; }
    location = /style.css { add_header Cache-Control "no-store" always; }
    location /fonts/ { }

    # Every other path: the page in the visitor's language, as a 503 that says
    # when to try again.
    location / { return 503; }
    error_page 503 @page;
    location @page {
        ssi on;
        add_header Retry-After 3600 always;
        add_header Cache-Control "no-store" always;
        add_header Vary Accept-Language always;
        try_files /index.$lang.html =503;
    }
}
