server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /ping { return 200 "ok\n"; }
    location = /style.css { add_header Cache-Control "no-store" always; }
    location /fonts/ { }

    # Every other path: the page, as a 503 that says when to try again. The
    # page picks its language and fills in the host name itself.
    location / { return 503; }
    error_page 503 /index.html;
    location = /index.html {
        internal;
        add_header Retry-After 3600 always;
        add_header Cache-Control "no-store" always;
    }
}
